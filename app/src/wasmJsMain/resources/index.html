    <title>Wasm Code Editor</title>
    <link rel="icon" href="data:,">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>

<body>
<!-- importmap -->
<script>
    // Skia reads the unmasked GPU name whenever the browser lists WEBGL_debug_renderer_info, but Skiko's
    // Emscripten glue never enables that extension, so every start logged a WebGL INVALID_ENUM warning.
    const getContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, ...rest) {
        const context = getContext.call(this, type, ...rest);
        if (context && String(type).startsWith('webgl')) context.getExtension('WEBGL_debug_renderer_info');
        return context;
    };
</script>
<script type="module" src="wasm-code-editor-app.mjs"></script>
</body>
</html>
